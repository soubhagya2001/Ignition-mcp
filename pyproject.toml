[project]
name = "ignition-mcp"
version = "0.1.0"
description = "AI-controlled MCP server for Ignition SCADA/HMI — zero credentials, fully autonomous"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ignition MCP Contributors" }]
keywords = ["ignition", "scada", "mcp", "ai", "automation", "hmi", "perspective"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]

dependencies = [
    "mcp>=1.2.0,<3",          # MCP protocol — v1 (FastMCP) and v2 (MCPServer) supported
    "httpx>=0.25.0",          # Async HTTP client for Ignition REST API
    "anyio>=4.0.0",           # Async runtime (works with asyncio + trio)
    "zeroconf>=0.47.0",       # mDNS/Bonjour for gateway auto-discovery
    "keyring>=24.0.0",        # OS credential store (Windows/macOS/Linux)
    "python-dotenv>=1.0.0",   # Optional .env support (not required by default)
    "rich>=13.0.0",           # Pretty logging and diagnostics
    "xmltodict>=0.13.0",      # Parse gateway.xml from local install
    "aiosqlite>=0.19.0",      # Async SQLite reads from config.idb
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.20",        # Mock httpx calls in tests
    "ruff>=0.6.0",        # Linting + formatting
    "mypy>=1.0",          # Type checking
]

[project.scripts]
ignition-mcp = "ignition_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/your-org/ignition-mcp"
Documentation = "https://github.com/your-org/ignition-mcp#readme"
Changelog = "https://github.com/your-org/ignition-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/your-org/ignition-mcp/issues"

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.20",
    "ruff>=0.6.0",
    "mypy>=1.0",
]

# ---------------------------------------------------------------------------
# Optional: embed MCP hint for gateway URL here (alternative to env var)
# The AI reads this section during discovery (Priority 5 in AutoConnect chain)
# ---------------------------------------------------------------------------
# [tool.ignition-mcp]
# gateway_url = "http://localhost:8088"
# project = "MyProject"

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF001", # ambiguous unicode in docstrings is intentional (× in formulas)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["ignition_mcp"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow bare assert in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["ignition_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ignition_mcp"]
